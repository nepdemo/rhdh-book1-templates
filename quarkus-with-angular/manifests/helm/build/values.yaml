app:
  name: ${{values.component_id}}
  namespace: ${{values.namespace}}
  cluster: ${{values.cluster}}

git:
  branch: main
  repo: ${{values.source_repository}}
  org: ${{values.git_owner}}
  name: ${{values.repository_name}}
  host: ${{values.git_host}}
  # token: ${{values.git_token}}
  webhookSecret: ''
  pollSchedule: "*/1 * * * *"
  pollerImage: "quay.io/wangzheng422/qimgs:rocky9-test-2025.04.30.v01"
  committerEmail: "commitor@wzhlab.top"
  patSecretName: "github-pat-secret"
  patSecretKey: "pat"

image:
  host: ${{values.image_host}}
  name: ${{values.image_name}}
  tag: ${{values.image_tag}}
